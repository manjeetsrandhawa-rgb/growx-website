<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GrowX Automations — Live Performance Feed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background-color: #080B12; color: #F3F4F6; font-family: system-ui, -apple-system, sans-serif; }
    .card { background-color: #121722; border: 1px solid #1E293B; }
    .gold { color: #D4AF37; }
    .cyan { color: #00FFFF; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div class="max-w-5xl mx-auto space-y-6">
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold tracking-wide gold">GROWX AUTOMATIONS</h1>
        <p class="text-sm text-slate-400 flex items-center gap-2 mt-1">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>Live Market Execution Feed</span>
          <span id="lastUpdated" class="text-xs text-slate-500 ml-2">Syncing...</span>
        </p>
      </div>

      <!-- Mode Filter Buttons -->
      <div class="inline-flex rounded-lg bg-slate-900 p-1 border border-slate-800">
        <button onclick="setMode('ALL')" id="btn-ALL" class="px-4 py-1.5 text-xs font-semibold rounded-md bg-amber-500 text-black">ALL</button>
        <button onclick="setMode('LIVE')" id="btn-LIVE" class="px-4 py-1.5 text-xs font-semibold rounded-md text-slate-300 hover:text-white">LIVE</button>
        <button onclick="setMode('DEMO')" id="btn-DEMO" class="px-4 py-1.5 text-xs font-semibold rounded-md text-slate-300 hover:text-white">DEMO</button>
      </div>
    </div>

    <!-- Summary Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="card rounded-xl p-4">
        <p class="text-xs text-slate-400">Net P&amp;L</p>
        <p id="statPnl" class="text-xl font-bold mt-1 text-emerald-400">₹0.00</p>
      </div>
      <div class="card rounded-xl p-4">
        <p class="text-xs text-slate-400">Win Rate</p>
        <p id="statWinRate" class="text-xl font-bold mt-1 cyan">0.0%</p>
        <p id="statWL" class="text-xs text-slate-500 mt-0.5">0W / 0L</p>
      </div>
      <div class="card rounded-xl p-4">
        <p class="text-xs text-slate-400">Total Turnover</p>
        <p id="statTurnover" class="text-xl font-bold mt-1 text-white">₹0</p>
      </div>
      <div class="card rounded-xl p-4">
        <p class="text-xs text-slate-400">Latest Balance</p>
        <p id="statBal" class="text-xl font-bold mt-1 gold">₹0.00</p>
      </div>
    </div>

    <!-- Live Equity Curve -->
    <div class="card rounded-xl p-4">
      <h2 class="text-sm font-semibold text-slate-300 mb-3">Live Cumulative P&amp;L Curve (₹)</h2>
      <div class="h-56">
        <canvas id="pnlChart"></canvas>
      </div>
    </div>

    <!-- Recent Trades Table -->
    <div class="card rounded-xl overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-800 flex justify-between items-center">
        <h2 class="text-sm font-semibold text-slate-300">Recent Verified Trades</h2>
        <span class="text-xs text-slate-500">Auto-refreshes every 15s</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-900/70 text-slate-400 uppercase">
            <tr>
              <th class="px-4 py-3">Time (IST)</th>
              <th class="px-4 py-3">Mode</th>
              <th class="px-4 py-3">Stake</th>
              <th class="px-4 py-3">Target</th>
              <th class="px-4 py-3">Crash</th>
              <th class="px-4 py-3">Result</th>
              <th class="px-4 py-3 text-right">Net P&amp;L</th>
            </tr>
          </thead>
          <tbody id="tradesBody" class="divide-y divide-slate-800/70">
            <tr><td colspan="7" class="px-4 py-6 text-center text-slate-500">Loading live data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // APNA GOOGLE APPS SCRIPT /exec URL YAHAN PASTE KAREIN
    const API_URL = "https://script.google.com/macros/s/AKfycbx5QEI1E9bnmhxzwXyDfSqnV5ikNUzRDrRmQG0zBzU5_PODrpvZU4lKu2I_xAm6_g/exec";
    let currentMode = "ALL";
    let chartInstance = null;

    function setMode(mode) {
      currentMode = mode;
      ["ALL", "LIVE", "DEMO"].forEach(m => {
        const btn = document.getElementById("btn-" + m);
        btn.className = (m === mode)
          ? "px-4 py-1.5 text-xs font-semibold rounded-md bg-amber-500 text-black"
          : "px-4 py-1.5 text-xs font-semibold rounded-md text-slate-300 hover:text-white";
      });
      fetchLiveStats();
    }

    async function fetchLiveStats() {
      try {
        const res = await fetch(`${API_URL}?mode=${currentMode}`);
        const data = await res.json();
        if (data.status !== "success") return;

        document.getElementById("lastUpdated").textContent = "Updated: " + data.updated_ist;
        const s = data.summary;

        const pnlEl = document.getElementById("statPnl");
        pnlEl.textContent = (s.net_pnl >= 0 ? "+₹" : "-₹") + Math.abs(s.net_pnl).toLocaleString("en-IN");
        pnlEl.className = "text-xl font-bold mt-1 " + (s.net_pnl >= 0 ? "text-emerald-400" : "text-rose-400");

        document.getElementById("statWinRate").textContent = s.win_rate + "%";
        document.getElementById("statWL").textContent = `${s.wins}W / ${s.losses}L (${s.total_trades} Trades)`;
        document.getElementById("statTurnover").textContent = "₹" + s.turnover.toLocaleString("en-IN");
        document.getElementById("statBal").textContent = "₹" + s.balance.toLocaleString("en-IN");

        // Update Chart
        const labels = data.equity_curve.map(p => p.time.split(" ")[1] || p.time);
        const values = data.equity_curve.map(p => p.pnl);
        const ctx = document.getElementById("pnlChart").getContext("2d");

        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
          type: "line",
          data: {
            labels: labels,
            datasets: [{
              label: "Net P&L (₹)",
              data: values,
              borderColor: "#00FFFF",
              backgroundColor: "rgba(0, 255, 255, 0.08)",
              borderWidth: 2,
              pointRadius: 2,
              fill: true,
              tension: 0.3
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { ticks: { color: "#64748B", maxTicksLimit: 8 }, grid: { color: "#1E293B" } },
              y: { ticks: { color: "#64748B" }, grid: { color: "#1E293B" } }
            }
          }
        });

        // Update Table
        const tbody = document.getElementById("tradesBody");
        if (data.recent_trades.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="px-4 py-6 text-center text-slate-500">No trades found for ${currentMode} mode.</td></tr>`;
          return;
        }
        tbody.innerHTML = data.recent_trades.map(t => `
          <tr class="hover:bg-slate-800/40">
            <td class="px-4 py-2.5 text-slate-300">${t.time}</td>
            <td class="px-4 py-2.5"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${t.mode === 'LIVE' ? 'bg-emerald-500/20 text-emerald-300' : 'bg-blue-500/20 text-blue-300'}">${t.mode}</span></td>
            <td class="px-4 py-2.5 text-slate-200">₹${t.stake}</td>
            <td class="px-4 py-2.5 text-amber-300">${t.target}</td>
            <td class="px-4 py-2.5 text-slate-200">${t.crash}</td>
            <td class="px-4 py-2.5 font-bold ${t.result === 'WIN' ? 'text-emerald-400' : 'text-rose-400'}">${t.result}</td>
            <td class="px-4 py-2.5 text-right font-semibold ${t.pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${t.pnl >= 0 ? '+₹' : '-₹'}${Math.abs(t.pnl)}</td>
          </tr>
        `).join("");
      } catch (e) {
        console.error(e);
      }
    }

    fetchLiveStats();
    setInterval(fetchLiveStats, 15000);
  </script>
</body>
</html>
